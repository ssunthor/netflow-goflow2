services:
  goflow2:
    image: netsampler/goflow2:latest
    container_name: goflow2
    restart: always
    ports:
      - "2055:2055/udp" # NetFlow port
    command: >
      -listen=netflow://:2055
      -format=json
      -transport=kafka
      -transport.kafka.brokers=10.250.133.29:9092,10.250.133.30:9092,10.250.133.31:9092
      -transport.kafka.topic=netflow-input
